spring.application.name=accounts-service

# ===== Conexao com o banco =====
spring.datasource.url=jdbc:postgresql://localhost:5433/novapay_accounts
spring.datasource.username=novapay
spring.datasource.password=novapay

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ===== Servidor =====
server.port=8081


novapay.jwt.secret=${JWT_SECRET:dev-only-chave-secreta-com-no-minimo-32-caracteres}
novapay.jwt.expiration-minutes=15