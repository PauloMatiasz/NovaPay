name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: novapay_accounts
          POSTGRES_USER: novapay
          POSTGRES_PASSWORD: novapay
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U novapay -d novapay_accounts"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v6

      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e rodar testes
        run: mvn -B verify

      - name: Guardar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cobertura-jacoco
          path: services/accounts-service/target/site/jacoco/
